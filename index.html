<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>iOS Style — правила и проекты</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f5f7;
            font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', system-ui, sans-serif;
            padding: 2rem 1rem;
            color: #1d1c1f;
        }
        .ios-container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08), 0 0 0 0.5px rgba(0, 0, 0, 0.02);
            overflow: hidden;
        }
        .ios-tabs {
            background: #ffffff;
            padding: 0.5rem 2rem;
            display: flex;
            gap: 2rem;
            border-bottom: 0.5px solid #c6c6c8;
        }
        .tab-btn {
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: 500;
            font-family: inherit;
            color: #8e8e93;
            padding: 0.8rem 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            color: #0a84ff;
            border-bottom: 2px solid #0a84ff;
            margin-bottom: -1px;
        }
        .page {
            display: none;
            padding: 2rem;
        }
        .page.active-page {
            display: block;
        }
        .rules-group {
            margin-bottom: 2rem;
        }
        .rules-group h3 {
            font-weight: 600;
            font-size: 1.3rem;
            margin-bottom: 1rem;
            padding-left: 0.5rem;
            color: #1c1c1e;
        }
        .rules-list {
            list-style: none;
            background: #f9f9fb;
            border-radius: 14px;
            overflow: hidden;
            border: 0.5px solid #e9e9ef;
        }
        .rules-list li {
            padding: 0.9rem 1rem;
            border-bottom: 0.5px solid #e9e9ef;
            color: #2c2c2e;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .rules-list li:last-child {
            border-bottom: none;
        }
        .punishment-item {
            padding: 0.9rem 1rem;
            border-bottom: 0.5px solid #e9e9ef;
        }
        .punishment-name {
            font-weight: 500;
            color: #1c1c1e;
            margin-bottom: 0.25rem;
        }
        .punishment-desc {
            font-size: 0.85rem;
            color: #0a84ff;
        }
        .moder-section {
            margin-top: 2rem;
            text-align: center;
        }
        .moder-toggle {
            background: #0a84ff;
            border: none;
            padding: 0.7rem 1.5rem;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            color: white;
            cursor: pointer;
            border-radius: 40px;
            transition: 0.2s;
        }
        .moder-toggle:hover {
            background: #0063ce;
        }
        .moder-panel {
            margin-top: 1.5rem;
            background: #f9f9fb;
            border-radius: 18px;
            padding: 0;
            text-align: left;
            border: 0.5px solid #e9e9ef;
            overflow: hidden;
        }
        .projects-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .project-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1rem;
            cursor: pointer;
            background: #ffffff;
            border-radius: 14px;
            transition: background 0.1s ease;
            border: 0.5px solid #e9e9ef;
        }
        .project-item:hover {
            background: #f2f2f5;
        }
        .project-avatar {
            font-size: 32px;
            width: 48px;
            text-align: center;
        }
        .project-name {
            font-size: 1.1rem;
            font-weight: 500;
            color: #1c1c1e;
        }
        .reload-hint {
            font-size: 0.7rem;
            text-align: right;
            margin-bottom: 1rem;
            color: #8e8e93;
        }
        footer {
            border-top: 0.5px solid #e9e9ef;
            margin-top: 0.5rem;
            padding: 1rem;
            text-align: center;
            font-size: 0.7rem;
            color: #8e8e93;
        }
    </style>
</head>
<body>
<div class="ios-container">
    <div class="ios-tabs">
        <button class="tab-btn active" data-tab="projects">📁 ПРОЕКТЫ</button>
        <button class="tab-btn" data-tab="rules">📜 ПРАВИЛА</button>
    </div>

    <div id="projectsPage" class="page active-page">
        <div class="reload-hint">⚡ projects.json — редактируй, обнови страницу</div>
        <div id="projectsContainer" class="projects-list">загрузка...</div>
    </div>

    <div id="rulesPage" class="page">
        <div id="rulesContent"></div>
        <div class="moder-section">
            <button id="moderBtn" class="moder-toggle">🔐 раздел для модераторов и стажёров</button>
            <div id="moderPanel" style="display: none; margin-top: 1.2rem;"></div>
        </div>
    </div>
    <footer>ios style · правила и проекты</footer>
</div>

<script>
    (function() {
        async function loadProjects() {
            const container = document.getElementById('projectsContainer');
            if (!container) return;
            try {
                const response = await fetch('projects.json?t=' + Date.now());
                if (!response.ok) throw new Error('файл не найден');
                const projects = await response.json();
                if (!projects.length) {
                    container.innerHTML = '<div class="project-item"><div class="project-avatar">📁</div><div class="project-name">нет проектов, добавь в projects.json</div></div>';
                    return;
                }
                container.innerHTML = projects.map(p => `
                    <div class="project-item" data-link="${p.link || '#'}">
                        <div class="project-avatar">${p.avatarEmoji ? p.avatarEmoji : (p.avatarUrl ? `<img src="${p.avatarUrl}" width="32" style="border-radius:16px;">` : '📄')}</div>
                        <div class="project-name">${escapeHtml(p.name)}</div>
                    </div>
                `).join('');
                document.querySelectorAll('.project-item').forEach(el => {
                    const link = el.getAttribute('data-link');
                    if (link && link !== '#') {
                        el.addEventListener('click', () => window.open(link, '_blank'));
                    }
                });
            } catch(e) {
                container.innerHTML = '<div class="project-item"><div class="project-avatar">⚠️</div><div class="project-name">projects.json не найден</div></div>';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function renderRules() {
            const container = document.getElementById('rulesContent');
            if (!container) return;
            const rulesData = {
                temp: ["Запрещены политические дискуссии, агитация и провокационные темы, не относящиеся к проекту","За чрезмерное использование нецензурной лексики будет выдаваться предупреждение"],
                forbidden: ["Спам","ASCII графика","Флуд","Отправка материалов с тегом 18+ (Шок-контент)","Отправка стикеров с тегом 18+","Отправка сообщений/материалов от имени канала (Разрешено только от личного аккаунта)","Содержание в профиле аккаунта неподобающего контента","Прямые или косвенные оскорбления других участников","Дискриминация по национальному, религиозному или иному признаку","Угрозы","Действия, направленные на провокацию конфликтов, травлю или преследование участников","Пропаганда насилия, оружия, наркотических средств, алкоголя, табачных изделий","Распространение сообщений/материалов, разглашающие любую информацию участника/модератора/администратора без его согласия","Размещение рекламы сторонних проектов/ресурсов/файлов без разрешения администрации","Распространение программ с уязвимостями/вирусами","Продажа игровых аккаунтов/карт","Распространение ложной информации","Попрошайничество","Выдавать себя за модерацию/администрацию проектов","Критика действий модерации/администрации","Неадекватная критика. Даже если вам не нравится какой-то контент в игре, не стоит оскорблять чужой труд","Использование дополнительных аккаунтов для обхода ограничений/блокировки","Использование команд /report и @admin без весомой причины"],
                not_recommended: ["Злоупотребление Caps Lock","Злоупотребление смайлами","Злоупотребление реакциями под сообщениями","Игнорирование предупреждений от модерации/администрации"],
                info: ["Незнание правил не освобождает от ответственности","Администрация и модерация оставляет за собой право удалять сообщения без объяснения причин","С 00:00 до 09:00 (МСК) действует ограничение на отправку медиа во всех чатах","Если Вас не устраивает поведение какого-либо участника, Вы можете написать жалобу о нем, использовав команду /report или @admin"],
                report: ["Команда доступна только в ответ на сообщение с нарушением","Сообщение должно содержать указание причины нарушения"]
            };
            container.innerHTML = `
                <div class="rules-group"><h3>⏳ Временные правила</h3><ul class="rules-list">${rulesData.temp.map(t => `<li>${t}</li>`).join('')}</ul></div>
                <div class="rules-group"><h3>🚫 Запрещено</h3><ul class="rules-list">${rulesData.forbidden.map(f => `<li>${f}</li>`).join('')}</ul></div>
                <div class="rules-group"><h3>⚠️ Не рекомендуется</h3><ul class="rules-list">${rulesData.not_recommended.map(n => `<li>${n}</li>`).join('')}</ul></div>
                <div class="rules-group"><h3>ℹ️ Прочая информация</h3><ul class="rules-list">${rulesData.info.map(i => `<li>${i}</li>`).join('')}</ul></div>
                <div class="rules-group"><h3>📢 Жалоба (/report или @admin)</h3><ul class="rules-list">${rulesData.report.map(r => `<li>${r}</li>`).join('')}</ul></div>
            `;
        }

        function renderModerPanel() {
            const panel = document.getElementById('moderPanel');
            if (!panel) return;
            const punishments = [
                { name: "Спам", desc: "Предупреждение + мут 1 час" },
                { name: "Флуд / ASCII графика", desc: "Предупреждение + мут 45 минут" },
                { name: "Контент 18+ (шок, стикеры)", desc: "Бан на 5 дней / перманент при рецидиве" },
                { name: "Оскорбления, дискриминация, травля", desc: "Мут 3 часа / бан до 14 дней" },
                { name: "Реклама без разрешения", desc: "Кик + предупреждение, повтор — бан" },
                { name: "Политические / религиозные провокации", desc: "Мут 6 часов / снятие прав у стажёра" },
                { name: "Выдача себя за администрацию", desc: "Перманентный бан без апелляции" },
                { name: "Критика действий модерации (публичная)", desc: "Выговор / лишение прав на 3 дня" },
                { name: "Использование мультиаккаунтов", desc: "Блокировка основного аккаунта + 30 дней бана" },
                { name: "Ложные вызовы /report или @admin", desc: "Предупреждение, при рецидиве мут 1 час" },
                { name: "Распространение вирусов/уязвимостей", desc: "Мгновенный перманентный бан" },
                { name: "Продажа аккаунтов/карт", desc: "Бан на 60 дней" },
                { name: "Неадекватная критика чужого труда", desc: "Мут 2 часа" }
            ];
            panel.innerHTML = `
                <div class="rules-group"><h3>🛡️ Наказания для стажёров и модераторов</h3>
                <div style="background: #f9f9fb; border-radius: 14px; overflow: hidden; border: 0.5px solid #e9e9ef;">
                    ${punishments.map(p => `
                        <div class="punishment-item">
                            <div class="punishment-name">${p.name}</div>
                            <div class="punishment-desc">→ ${p.desc}</div>
                        </div>
                    `).join('')}
                </div>
                <div style="margin-top: 0.8rem; font-size:0.8rem; color:#8e8e93; padding: 0 0.5rem;">⚙️ Администрация может ужесточить меры в зависимости от тяжести нарушения.</div>
            `;
        }

        function initTabs() {
            const tabs = document.querySelectorAll('.tab-btn');
            const projectsDiv = document.getElementById('projectsPage');
            const rulesDiv = document.getElementById('rulesPage');
            if (!tabs.length) return;
            tabs.forEach(btn => {
                btn.addEventListener('click', () => {
                    const tab = btn.dataset.tab;
                    tabs.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    if (tab === 'projects') {
                        projectsDiv.classList.add('active-page');
                        rulesDiv.classList.remove('active-page');
                        loadProjects();
                    } else {
                        rulesDiv.classList.add('active-page');
                        projectsDiv.classList.remove('active-page');
                    }
                });
            });
        }

        function moderToggle() {
            const btn = document.getElementById('moderBtn');
            const panel = document.getElementById('moderPanel');
            if (btn && panel) {
                btn.addEventListener('click', () => {
                    if (panel.style.display === 'none') {
                        panel.style.display = 'block';
                        btn.textContent = '❌ скрыть раздел модераторов';
                        renderModerPanel();
                    } else {
                        panel.style.display = 'none';
                        btn.textContent = '🔐 раздел для модераторов и стажёров';
                    }
                });
            }
        }

        renderRules();
        loadProjects();
        initTabs();
        moderToggle();
    })();
</script>
</body>
</html>
