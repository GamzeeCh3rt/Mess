<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Violet Messenger</title>

  <!-- iOS Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <!-- TOP -->
      <div class="sidebar-top">
        <div class="profile-preview">
          <div class="avatar large"></div>

          <div class="profile-info">
            <h2>Daniel</h2>
            <span>online</span>
          </div>
        </div>

        <button class="icon-btn">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 5V19" stroke-width="2" stroke-linecap="round"/>
            <path d="M5 12H19" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <!-- SEARCH -->
      <div class="search-box">
        <input type="text" placeholder="Search" />
      </div>

      <!-- CHAT LIST -->
      <div class="chat-list">

        <div class="chat-item active">
          <div class="avatar purple"></div>

          <div class="chat-content">
            <div class="chat-top-row">
              <h3>Max</h3>
              <span>13:37</span>
            </div>

            <div class="chat-bottom-row">
              <p>Send the design files</p>
              <div class="unread-count">2</div>
            </div>
          </div>
        </div>

        <div class="chat-item">
          <div class="avatar"></div>

          <div class="chat-content">
            <div class="chat-top-row">
              <h3>Alex</h3>
              <span>11:20</span>
            </div>

            <div class="chat-bottom-row">
              <p>Photo received</p>
            </div>
          </div>
        </div>

        <div class="chat-item">
          <div class="avatar"></div>

          <div class="chat-content">
            <div class="chat-top-row">
              <h3>Group Chat</h3>
              <span>Yesterday</span>
            </div>

            <div class="chat-bottom-row">
              <p>3 new messages</p>
            </div>
          </div>
        </div>

      </div>

      <!-- IOS SETTINGS STYLE -->
      <div class="settings-panel">

        <div class="settings-header">
          <h2>Settings</h2>
        </div>

        <div class="settings-group">

          <div class="settings-profile-card">
            <div class="avatar huge"></div>

            <div class="settings-profile-info">
              <h3>Daniel Frost</h3>
              <p>@daniel</p>
            </div>
          </div>

        </div>

        <div class="settings-group">

          <button class="settings-item">
            <div class="settings-left">
              <div class="settings-icon purple-bg"></div>
              <span>Saved Messages</span>
            </div>

            <div class="settings-arrow"></div>
          </button>

          <button class="settings-item">
            <div class="settings-left">
              <div class="settings-icon blue-bg"></div>
              <span>Recent Calls</span>
            </div>

            <div class="settings-arrow"></div>
          </button>

          <button class="settings-item">
            <div class="settings-left">
              <div class="settings-icon green-bg"></div>
              <span>Devices</span>
            </div>

            <div class="settings-arrow"></div>
          </button>

        </div>

        <div class="settings-group">

          <button class="settings-item">
            <div class="settings-left">
              <div class="settings-icon gray-bg"></div>
              <span>Appearance</span>
            </div>

            <div class="settings-arrow"></div>
          </button>

          <button class="settings-item">
            <div class="settings-left">
              <div class="settings-icon orange-bg"></div>
              <span>Notifications</span>
            </div>

            <div class="settings-arrow"></div>
          </button>

          <button class="settings-item">
            <div class="settings-left">
              <div class="settings-icon red-bg"></div>
              <span>Privacy & Security</span>
            </div>

            <div class="settings-arrow"></div>
          </button>

        </div>

      </div>

    </aside>

    <!-- CHAT AREA -->
    <main class="chat-area">

      <!-- CHAT HEADER -->
      <header class="chat-header">

        <div class="chat-user">
          <div class="avatar"></div>

          <div>
            <h2>Max</h2>
            <span>online</span>
          </div>
        </div>

        <div class="chat-actions">
          <button class="icon-btn"></button>
          <button class="icon-btn"></button>
        </div>

      </header>

      <!-- MESSAGES -->
      <section class="messages-area">

        <div class="message incoming">
          <div class="message-bubble">
            yo
          </div>
        </div>

        <div class="message outgoing">
          <div class="message-bubble">
            send assets pls
          </div>
        </div>

        <div class="message incoming image-message">
          <div class="message-bubble image-bubble">
            <img src="https://picsum.photos/300/220" alt="image" />
          </div>
        </div>

      </section>

      <!-- INPUT -->
      <footer class="chat-input-area">

        <button class="attach-btn">
          +
        </button>

        <div class="message-input-wrapper">
          <input type="text" placeholder="Message" />
        </div>

        <label class="image-upload-btn">
          <input type="file" hidden accept="image/*" />
        </label>

        <button class="send-btn">
          ➜
        </button>

      </footer>

    </main>

  </div>

  <!-- MOBILE NAVBAR -->
  <nav class="mobile-navbar">

    <button class="mobile-nav-item active">
      <span>Chats</span>
    </button>

    <button class="mobile-nav-item">
      <span>Settings</span>
    </button>

  </nav>

  <!-- Scripts -->
  <script src="app.js"></script>
</body>
</html>
