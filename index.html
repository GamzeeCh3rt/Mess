<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>KDEterm — мессенджер</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1e1e24; height: 100vh; font-family: 'JetBrains Mono', monospace; overflow: hidden; color: #cdd6f4; }
        .app { width: 100%; height: 100%; display: flex; background: #18181e; }
        .sidebar { width: 300px; background: #111116; border-right: 1px solid #2a2a32; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px 16px; border-bottom: 1px solid #2a2a32; }
        .title { font-size: 14px; color: #89b4fa; margin-bottom: 16px; }
        .search-btn { background: #2a2a32; border: none; color: #cdd6f4; font-family: monospace; padding: 8px 12px; width: 100%; text-align: left; cursor: pointer; border-radius: 8px; margin-bottom: 8px; }
        .search-btn:hover { background: #313244; }
        .chat-list { flex: 1; overflow-y: auto; padding: 8px; }
        .chat-item { padding: 10px 12px; border-radius: 8px; margin-bottom: 4px; cursor: pointer; background: #1a1a22; }
        .chat-item:hover { background: #2a2a32; }
        .chat-item.active { background: #313244; color: #89b4fa; }
        .chat-name { font-weight: 500; }
        .chat-last { font-size: 11px; color: #6c7086; margin-top: 2px; }
        .sidebar-footer { padding: 16px; border-top: 1px solid #2a2a32; }
        .settings-btn { background: none; border: 1px solid #2a2a32; color: #cdd6f4; padding: 6px 12px; width: 100%; cursor: pointer; border-radius: 8px; font-family: monospace; }
        .main { flex: 1; display: flex; flex-direction: column; background: #1e1e24; }
        .chat-header { padding: 20px 24px; border-bottom: 1px solid #2a2a32; background: #18181e; }
        .current-chat-name { font-size: 18px; font-weight: 500; }
        .messages-area { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }
        .message { display: flex; flex-direction: column; max-width: 70%; }
        .message-mine { align-self: flex-end; align-items: flex-end; }
        .message-them { align-self: flex-start; align-items: flex-start; }
        .message-sender { font-size: 11px; color: #6c7086; margin-bottom: 4px; }
        .message-bubble { background: #2a2a32; padding: 8px 14px; border-radius: 12px; font-size: 14px; }
        .message-mine .message-bubble { background: #89b4fa; color: #111116; }
        .message-time { font-size: 10px; color: #585b70; margin-top: 4px; }
        .input-area { padding: 16px 24px 24px; border-top: 1px solid #2a2a32; background: #1e1e24; }
        .input-row { display: flex; gap: 12px; align-items: flex-end; }
        .message-input { flex: 1; background: #111116; border: 1px solid #2a2a32; border-radius: 12px; padding: 10px 16px; color: #cdd6f4; font-family: monospace; resize: none; outline: none; }
        .send-btn { background: #89b4fa; border: none; border-radius: 12px; padding: 10px 20px; color: #111116; font-weight: bold; cursor: pointer; font-family: monospace; }
        .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: #585b70; }
        .auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111116; display: flex; align-items: center; justify-content: center; z-index: 100; }
        .auth-container { background: #1e1e24; border: 1px solid #2a2a32; border-radius: 16px; padding: 32px; width: 360px; }
        .auth-title { font-size: 24px; color: #89b4fa; margin-bottom: 24px; text-align: center; }
        .auth-tabs { display: flex; gap: 16px; margin-bottom: 24px; }
        .auth-tab { flex: 1; background: none; border: none; padding: 8px; color: #6c7086; cursor: pointer; font-family: monospace; }
        .auth-tab.active { color: #89b4fa; border-bottom: 2px solid #89b4fa; }
        .auth-form { display: flex; flex-direction: column; gap: 12px; }
        .auth-input { background: #111116; border: 1px solid #2a2a32; border-radius: 8px; padding: 10px; color: #cdd6f4; font-family: monospace; }
        .auth-btn { background: #89b4fa; border: none; border-radius: 8px; padding: 10px; color: #111116; font-weight: bold; cursor: pointer; font-family: monospace; }
        .auth-error { color: #f38ba8; font-size: 12px; text-align: center; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 200; }
        .modal-content { background: #1e1e24; border: 1px solid #2a2a32; border-radius: 16px; padding: 24px; width: 400px; max-width: 90%; }
        .modal-title { font-size: 18px; margin-bottom: 16px; color: #89b4fa; }
        .modal-input, .modal-textarea { width: 100%; background: #111116; border: 1px solid #2a2a32; border-radius: 8px; padding: 10px; color: #cdd6f4; margin-bottom: 16px; font-family: monospace; }
        .modal-textarea { resize: vertical; min-height: 200px; }
        .modal-buttons { display: flex; gap: 12px; justify-content: flex-end; }
        .modal-buttons button { background: #2a2a32; border: none; padding: 8px 16px; border-radius: 8px; color: #cdd6f4; cursor: pointer; }
        .search-result-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #2a2a32; }
        .start-chat-btn { background: #89b4fa; border: none; padding: 4px 12px; border-radius: 8px; cursor: pointer; font-family: monospace; }
        #searchResults { margin-top: 12px; max-height: 300px; overflow-y: auto; }
    </style>
    <style id="userCustomCSS"></style>
</head>
<body>

<div id="authScreen" class="auth-screen">
    <div class="auth-container">
        <div class="auth-title">kdeterm</div>
        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">вход</button>
            <button class="auth-tab" data-tab="register">регистрация</button>
        </div>
        <div id="loginForm" class="auth-form">
            <input type="text" id="loginEmail" placeholder="email" class="auth-input">
            <input type="password" id="loginPassword" placeholder="пароль" class="auth-input">
            <button id="loginBtn" class="auth-btn">войти</button>
            <div id="loginError" class="auth-error"></div>
        </div>
        <div id="registerForm" class="auth-form" style="display:none">
            <input type="text" id="regNick" placeholder="никнейм" class="auth-input">
            <input type="email" id="regEmail" placeholder="email" class="auth-input">
            <input type="password" id="regPassword" placeholder="пароль" class="auth-input">
            <button id="registerBtn" class="auth-btn">зарегистрироваться</button>
            <div id="regError" class="auth-error"></div>
        </div>
    </div>
</div>

<div id="appScreen" class="app" style="display:none">
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="title">kdeterm — <span id="myNameDisplay"></span></div>
            <button class="search-btn" id="searchBtn">🔍 поиск пользователей</button>
        </div>
        <div class="chat-list" id="chatList"></div>
        <div class="sidebar-footer">
            <button class="settings-btn" id="openSettingsBtn">⚙ настройки</button>
        </div>
    </div>
    <div class="main">
        <div class="chat-header">
            <div class="current-chat-name" id="currentChatName">выберите чат</div>
        </div>
        <div class="messages-area" id="messagesArea">
            <div class="empty-state">~ нет выбранного диалога</div>
        </div>
        <div class="input-area" id="inputArea" style="display: none;">
            <div class="input-row">
                <textarea class="message-input" id="messageInput" rows="1" placeholder="сообщение..."></textarea>
                <button class="send-btn" id="sendBtn">отправить</button>
            </div>
        </div>
    </div>
</div>

<div id="searchModal" class="modal">
    <div class="modal-content">
        <div class="modal-title">поиск пользователей</div>
        <input type="text" id="searchInput" placeholder="никнейм" class="modal-input">
        <div id="searchResults"></div>
        <div class="modal-buttons">
            <button id="closeSearchBtn">закрыть</button>
        </div>
    </div>
</div>

<div id="settingsModal" class="modal">
    <div class="modal-content">
        <div class="modal-title">настройки</div>
        <label>ваше имя:</label>
        <input type="text" id="userNameInput" class="modal-input">
        <label>пользовательские стили CSS:</label>
        <textarea id="customCssInput" class="modal-textarea" placeholder="body { background: #000; } .message-bubble { border-radius: 0; }"></textarea>
        <div class="modal-buttons">
            <button id="saveSettingsBtn">сохранить</button>
            <button id="closeSettingsBtn">закрыть</button>
        </div>
        <div style="margin-top: 16px; border-top: 1px solid #2a2a32; padding-top: 12px;">
            <button id="logoutBtn" style="background: #f38ba8; color: #111116; width: 100%;">выйти</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js';
    import { getFirestore, collection, query, where, getDocs, getDoc, setDoc, doc, updateDoc, onSnapshot, addDoc, orderBy } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js';

    const firebaseConfig = {
        apiKey: "AIzaSyAk7KIpPcBUCphtRFza_YumrN2oEN5eoik",
        authDomain: "oleg-131d1.firebaseapp.com",
        projectId: "oleg-131d1",
        storageBucket: "oleg-131d1.firebasestorage.app",
        messagingSenderId: "513374206627",
        appId: "1:513374206627:web:6dba31687022a8a21f5d16"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;
    let currentUserData = null;
    let activeChatId = null;
    let chatsUnsubscribe = null;
    let messagesUnsubscribe = null;
    let allChats = [];

    // DOM elements
    const authScreen = document.getElementById('authScreen');
    const appScreen = document.getElementById('appScreen');
    const myNameDisplay = document.getElementById('myNameDisplay');
    const chatListDiv = document.getElementById('chatList');
    const messagesArea = document.getElementById('messagesArea');
    const inputArea = document.getElementById('inputArea');
    const currentChatNameSpan = document.getElementById('currentChatName');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const searchBtn = document.getElementById('searchBtn');
    const searchModal = document.getElementById('searchModal');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const closeSearchBtn = document.getElementById('closeSearchBtn');
    const settingsModal = document.getElementById('settingsModal');
    const openSettingsBtn = document.getElementById('openSettingsBtn');
    const userNameInput = document.getElementById('userNameInput');
    const customCssInput = document.getElementById('customCssInput');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    // Auth tabs
    const authTabs = document.querySelectorAll('.auth-tab');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const loginBtn = document.getElementById('loginBtn');
    const registerBtn = document.getElementById('registerBtn');
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const loginError = document.getElementById('loginError');
    const regNick = document.getElementById('regNick');
    const regEmail = document.getElementById('regEmail');
    const regPassword = document.getElementById('regPassword');
    const regError = document.getElementById('regError');

    authTabs.forEach(tab => {
        tab.addEventListener('click', () => {
            authTabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            if (tab.dataset.tab === 'login') {
                loginForm.style.display = 'flex';
                registerForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'flex';
            }
        });
    });

    registerBtn.addEventListener('click', async () => {
        const nick = regNick.value.trim();
        const email = regEmail.value.trim();
        const password = regPassword.value;
        if (!nick || !email || !password) {
            regError.innerText = 'заполните все поля';
            return;
        }
        try {
            const userCred = await createUserWithEmailAndPassword(auth, email, password);
            await setDoc(doc(db, 'users', userCred.user.uid), {
                nick: nick,
                email: email,
                createdAt: Date.now()
            });
            regError.innerText = '';
            alert('регистрация успешна! теперь войдите');
        } catch (err) {
            regError.innerText = err.message;
        }
    });

    loginBtn.addEventListener('click', async () => {
        const email = loginEmail.value.trim();
        const password = loginPassword.value;
        if (!email || !password) {
            loginError.innerText = 'заполните поля';
            return;
        }
        try {
            await signInWithEmailAndPassword(auth, email, password);
        } catch (err) {
            loginError.innerText = err.message;
        }
    });

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            const userDoc = await getDoc(doc(db, 'users', user.uid));
            if (!userDoc.exists()) {
                await setDoc(doc(db, 'users', user.uid), { nick: user.email.split('@')[0], email: user.email, createdAt: Date.now() });
                currentUserData = { nick: user.email.split('@')[0] };
            } else {
                currentUserData = userDoc.data();
            }
            myNameDisplay.innerText = currentUserData.nick;
            userNameInput.value = currentUserData.nick;
            authScreen.style.display = 'none';
            appScreen.style.display = 'flex';
            loadCustomCSS();
            loadChats();
        } else {
            authScreen.style.display = 'flex';
            appScreen.style.display = 'none';
            if (chatsUnsubscribe) chatsUnsubscribe();
            if (messagesUnsubscribe) messagesUnsubscribe();
            activeChatId = null;
            allChats = [];
        }
    });

    async function loadChats() {
        if (chatsUnsubscribe) chatsUnsubscribe();
        const q = query(collection(db, 'chats'), where('participants', 'array-contains', currentUser.uid));
        chatsUnsubscribe = onSnapshot(q, async (snapshot) => {
            const chats = [];
            for (const docSnap of snapshot.docs) {
                const chat = { id: docSnap.id, ...docSnap.data() };
                const otherId = chat.participants.find(p => p !== currentUser.uid);
                const otherDoc = await getDoc(doc(db, 'users', otherId));
                chat.otherNick = otherDoc.exists() ? otherDoc.data().nick : otherId;
                chat.otherId = otherId;
                chats.push(chat);
            }
            allChats = chats;
            renderChatList(chats);
            
            if (activeChatId && !chats.find(c => c.id === activeChatId)) {
                activeChatId = null;
                renderMessages([]);
                inputArea.style.display = 'none';
                currentChatNameSpan.innerText = 'выберите чат';
            } else if (activeChatId) {
                const currentChat = chats.find(c => c.id === activeChatId);
                if (currentChat) {
                    currentChatNameSpan.innerText = currentChat.otherNick;
                }
                loadMessages(activeChatId);
            }
        });
    }

    function renderChatList(chats) {
        if (!chatListDiv) return;
        if (chats.length === 0) {
            chatListDiv.innerHTML = '<div style="padding: 12px; color: #6c7086;">нет диалогов, найдите пользователя через поиск</div>';
            return;
        }
        chatListDiv.innerHTML = chats.map(chat => {
            const activeClass = (activeChatId === chat.id) ? 'active' : '';
            return `
                <div class="chat-item ${activeClass}" data-chat-id="${chat.id}">
                    <div class="chat-name">${escapeHtml(chat.otherNick)}</div>
                    <div class="chat-last">${escapeHtml(chat.lastMessage || 'нет сообщений')}</div>
                </div>
            `;
        }).join('');
        
        document.querySelectorAll('.chat-item').forEach(el => {
            el.addEventListener('click', () => {
                const chatId = el.dataset.chatId;
                if (chatId) setActiveChat(chatId);
            });
        });
    }

    async function setActiveChat(chatId) {
        if (activeChatId === chatId) return;
        activeChatId = chatId;
        
        const chat = allChats.find(c => c.id === chatId);
        if (chat) {
            currentChatNameSpan.innerText = chat.otherNick;
            inputArea.style.display = 'flex';
        } else {
            const chatDoc = await getDoc(doc(db, 'chats', chatId));
            if (chatDoc.exists()) {
                const otherId = chatDoc.data().participants.find(p => p !== currentUser.uid);
                const otherDoc = await getDoc(doc(db, 'users', otherId));
                currentChatNameSpan.innerText = otherDoc.exists() ? otherDoc.data().nick : otherId;
                inputArea.style.display = 'flex';
            }
        }
        
        renderChatList(allChats);
        await loadMessages(chatId);
    }

    async function loadMessages(chatId) {
        if (messagesUnsubscribe) messagesUnsubscribe();
        const q = query(collection(db, 'messages'), where('chatId', '==', chatId), orderBy('timestamp', 'asc'));
        messagesUnsubscribe = onSnapshot(q, (snapshot) => {
            const messages = [];
            snapshot.forEach(doc => messages.push({ id: doc.id, ...doc.data() }));
            renderMessages(messages);
        });
    }

    function renderMessages(messages) {
        if (!messagesArea) return;
        if (!activeChatId) {
            messagesArea.innerHTML = '<div class="empty-state">~ выберите чат</div>';
            return;
        }
        if (messages.length === 0) {
            messagesArea.innerHTML = '<div class="empty-state">~ сообщений нет, напишите что-нибудь</div>';
            return;
        }
        messagesArea.innerHTML = messages.map(msg => {
            const isMine = msg.senderId === currentUser.uid;
            const senderName = isMine ? currentUserData.nick : (msg.senderName || 'собеседник');
            return `
                <div class="message ${isMine ? 'message-mine' : 'message-them'}">
                    <div class="message-sender">${escapeHtml(senderName)}</div>
                    <div class="message-bubble">${escapeHtml(msg.text)}</div>
                    <div class="message-time">${new Date(msg.timestamp).toLocaleTimeString()}</div>
                </div>
            `;
        }).join('');
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text || !activeChatId) return;
        try {
            await addDoc(collection(db, 'messages'), {
                chatId: activeChatId,
                senderId: currentUser.uid,
                senderName: currentUserData.nick,
                text: text,
                timestamp: Date.now()
            });
            await updateDoc(doc(db, 'chats', activeChatId), { lastMessage: text, lastUpdated: Date.now() });
            messageInput.value = '';
        } catch (err) {
            console.error('ошибка отправки:', err);
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // Поиск
    searchBtn.addEventListener('click', () => {
        searchModal.style.display = 'flex';
        searchInput.value = '';
        searchResults.innerHTML = '';
    });
    closeSearchBtn.addEventListener('click', () => searchModal.style.display = 'none');
    
    searchInput.addEventListener('input', async () => {
        const q = searchInput.value.trim().toLowerCase();
        if (q.length < 2) {
            searchResults.innerHTML = '';
            return;
        }
        try {
            const usersRef = collection(db, 'users');
            const snapshot = await getDocs(usersRef);
            const users = [];
            snapshot.forEach(doc => {
                if (doc.id !== currentUser.uid && doc.data().nick.toLowerCase().includes(q)) {
                    users.push({ id: doc.id, nick: doc.data().nick });
                }
            });
            if (users.length === 0) {
                searchResults.innerHTML = '<div style="padding: 8px; color: #6c7086;">никого не найдено</div>';
                return;
            }
            searchResults.innerHTML = users.map(u => `
                <div class="search-result-item">
                    <span>${escapeHtml(u.nick)}</span>
                    <button class="start-chat-btn" data-id="${u.id}">начать чат</button>
                </div>
            `).join('');
            
            document.querySelectorAll('.start-chat-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const otherId = btn.dataset.id;
                    let existingChatId = null;
                    for (const chat of allChats) {
                        if (chat.participants && chat.participants.includes(otherId)) {
                            existingChatId = chat.id;
                            break;
                        }
                    }
                    if (existingChatId) {
                        setActiveChat(existingChatId);
                    } else {
                        const newChatRef = await addDoc(collection(db, 'chats'), {
                            participants: [currentUser.uid, otherId],
                            createdAt: Date.now(),
                            lastMessage: ''
                        });
                        setActiveChat(newChatRef.id);
                    }
                    searchModal.style.display = 'none';
                    searchInput.value = '';
                    searchResults.innerHTML = '';
                });
            });
        } catch (err) {
            console.error('ошибка поиска:', err);
        }
    });

    // Настройки
    openSettingsBtn.addEventListener('click', () => settingsModal.style.display = 'flex');
    closeSettingsBtn.addEventListener('click', () => settingsModal.style.display = 'none');
    saveSettingsBtn.addEventListener('click', async () => {
        const newNick = userNameInput.value.trim();
        if (newNick && newNick !== currentUserData.nick) {
            await updateDoc(doc(db, 'users', currentUser.uid), { nick: newNick });
            currentUserData.nick = newNick;
            myNameDisplay.innerText = newNick;
        }
        const customCSS = customCssInput.value;
        localStorage.setItem('kdeterm_custom_css', customCSS);
        applyCustomCSS(customCSS);
        settingsModal.style.display = 'none';
    });
    logoutBtn.addEventListener('click', async () => {
        await signOut(auth);
    });

    function loadCustomCSS() {
        const saved = localStorage.getItem('kdeterm_custom_css');
        if (saved) {
            customCssInput.value = saved;
            applyCustomCSS(saved);
        }
    }
    function applyCustomCSS(css) {
        document.getElementById('userCustomCSS').innerHTML = css;
    }
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, (m) => {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
</script>
</body>
</html>
