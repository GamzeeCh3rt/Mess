<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ламповый уголок — проекты и правила</title>
    <style>
        /* Базовые стили, но основные ты добавишь потом */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1d23;
            font-family: 'Courier New', monospace;
            padding: 2rem 1rem;
            color: #e9f1e0;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #21262b;
            border-radius: 28px;
            border: 2px solid #4a5b6e;
            overflow: hidden;
        }
        .nav-menu {
            background: #2d353c;
            padding: 1rem 1.8rem;
            display: flex;
            gap: 2rem;
            border-bottom: 3px solid #6c8b5e;
        }
        .nav-btn {
            background: none;
            border: none;
            font-size: 1.6rem;
            font-weight: bold;
            font-family: monospace;
            color: #e3cfa5;
            cursor: pointer;
        }
        .nav-btn.active {
            color: #ffe1a0;
            border-bottom: 3px solid #dcaa4a;
        }
        .page {
            display: none;
            padding: 2rem;
        }
        .page.active-page {
            display: block;
        }
        .rules-list {
            background: #1e242b;
            border-radius: 24px;
            padding: 1rem 1.8rem;
            border-left: 8px solid #c3813b;
        }
        .rule-item {
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px dotted #5f7550;
        }
        .rule-title {
            font-weight: bold;
            color: #f3bc6c;
        }
        .punishment {
            color: #e38b6f;
            font-size: 0.85rem;
            margin-top: 4px;
        }
        .moder-block {
            margin-top: 2rem;
            text-align: center;
        }
        .moder-btn {
            background: #3a4842;
            border: 2px solid #c0a050;
            padding: 0.8rem 1.4rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 40px;
            color: #ffeaac;
        }
        .projects-grid {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
        .project-card {
            background: #262f36;
            border-radius: 28px;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1rem 1.6rem;
            border: 1px solid #4b6a45;
            cursor: pointer;
        }
        .project-avatar {
            width: 64px;
            height: 64px;
            background: #3a4a3a;
            border-radius: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            border: 2px solid #b69958;
        }
        .project-name {
            font-size: 1.6rem;
            font-weight: bold;
            color: #eedb9b;
        }
        .reload-note {
            font-size: 0.7rem;
            text-align: right;
            margin-bottom: 12px;
            color: #bdae83;
        }
        footer {
            text-align: center;
            padding: 1rem;
            border-top: 1px solid #3e4e3a;
            font-size: 0.7rem;
        }
        @media (max-width: 580px) {
            .project-card { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="nav-menu">
        <button class="nav-btn active" data-page="projects">📁 ПРОЕКТЫ</button>
        <button class="nav-btn" data-page="rules">📜 ПРАВИЛА</button>
    </div>

    <div id="projectsPage" class="page active-page">
        <div class="reload-note">⚡ projects.json — редактируй, добавляй проекты, обнови страницу</div>
        <div id="projectsContainer" class="projects-grid">Загрузка...</div>
    </div>

    <div id="rulesPage" class="page">
        <div id="rulesNormal" class="rules-list"></div>
        <div class="moder-block">
            <button id="moderToggleBtn" class="moder-btn">🔐 раздел для модераторов и стажеров</button>
        </div>
        <div id="moderRulesPanel" style="display: none; margin-top: 2rem;">
            <div id="rulesModer" class="rules-list"></div>
        </div>
    </div>
    <footer>ламповый уголок :: проекты и правила</footer>
</div>

<script>
    // ========== ПРАВИЛА ==========
    const normalRules = [
        { title: "Спам / Флуд / ASCII графика", desc: "Запрещены повторяющиеся сообщения, бессмысленный набор символов и крупные ASCII рисунки." },
        { title: "Контент 18+ (шок, стикеры)", desc: "Запрещены любые шокирующие, порнографические или жестокие медиа." },
        { title: "Оскорбления, дискриминация, травля", desc: "Прямые или косвенные оскорбления участников, угрозы, буллинг." },
        { title: "Реклама без разрешения", desc: "Размещение сторонних ссылок, приглашений, файлов без согласия администрации." },
        { title: "Политические и религиозные провокации", desc: "Обсуждения, агитация, разжигающие конфликты на почве политики/религии." },
        { title: "Выдача себя за администрацию / модерацию", desc: "Любые действия, имитирующие власть, фейковые аккаунты." },
        { title: "Критика действий модерации", desc: "Публичное обсуждение решений модераторов в негативном ключе." },
        { title: "Использование дополнительных аккаунтов", desc: "Обход блокировок или ограничений с помощью мультиаккаунтинга." },
        { title: "Команды /report и @admin без причины", desc: "Ложные вызовы модерации отвлекают от работы." }
    ];

    const moderRules = [
        { title: "Спам / Флуд / ASCII графика", punishment: "Предупреждение + мут 1 час" },
        { title: "Контент 18+ (шок, стикеры)", punishment: "Бан на 5 дней / перманент при рецидиве" },
        { title: "Оскорбления, дискриминация, травля", punishment: "Мут 3 часа / бан до 14 дней" },
        { title: "Реклама без разрешения", punishment: "Кик + предупреждение, при повторе — бан" },
        { title: "Политические и религиозные провокации", punishment: "Мут 6 часов / снятие прав у стажера" },
        { title: "Выдача себя за администрацию", punishment: "Перманентный бан без права апелляции" },
        { title: "Критика действий модерации (публичная)", punishment: "Выговор / лишение прав на 3 дня" },
        { title: "Использование дополнительных аккаунтов", punishment: "Блокировка основного аккаунта + 30 дней бана" },
        { title: "Команды /report и @admin без причины", punishment: "Предупреждение, при рецидиве — мут 1 час" }
    ];

    function renderNormalRules() {
        const container = document.getElementById('rulesNormal');
        if (!container) return;
        container.innerHTML = normalRules.map(r => `
            <div class="rule-item">
                <div class="rule-title">⚠️ ${r.title}</div>
                <div>${r.desc}</div>
            </div>
        `).join('');
    }

    function renderModerRules() {
        const container = document.getElementById('rulesModer');
        if (!container) return;
        container.innerHTML = moderRules.map(r => `
            <div class="rule-item">
                <div class="rule-title">🛡️ ${r.title}</div>
                <div class="punishment">Наказание: ${r.punishment}</div>
            </div>
        `).join('');
    }

    // ========== ПРОЕКТЫ ИЗ JSON ==========
    async function loadProjects() {
        try {
            const response = await fetch('projects.json');
            if (!response.ok) throw new Error('Файл projects.json не найден');
            const projects = await response.json();
            const container = document.getElementById('projectsContainer');
            if (!projects.length) {
                container.innerHTML = '<div class="project-card" style="justify-content:center;">🤷‍♂️ проектов пока нет, добавь в projects.json</div>';
                return;
            }
            container.innerHTML = projects.map(p => `
                <div class="project-card" data-link="${p.link || '#'}">
                    <div class="project-avatar">
                        ${p.avatarEmoji ? p.avatarEmoji : (p.avatarUrl ? `<img src="${p.avatarUrl}" width="56" style="border-radius:40px;">` : '📦')}
                    </div>
                    <div class="project-info">
                        <div class="project-name">${p.name}</div>
                    </div>
                </div>
            `).join('');
            document.querySelectorAll('.project-card').forEach(card => {
                const link = card.dataset.link;
                if (link && link !== '#') {
                    card.addEventListener('click', () => window.open(link, '_blank'));
                }
            });
        } catch (err) {
            document.getElementById('projectsContainer').innerHTML = '<div class="project-card">❌ projects.json не загружен, создай файл с массивом проектов</div>';
        }
    }

    // ========== НАВИГАЦИЯ ==========
    function setupNavigation() {
        const btns = document.querySelectorAll('.nav-btn');
        const pages = {
            projects: document.getElementById('projectsPage'),
            rules: document.getElementById('rulesPage')
        };
        btns.forEach(btn => {
            btn.addEventListener('click', () => {
                const pageId = btn.dataset.page;
                btns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                Object.values(pages).forEach(p => p.classList.remove('active-page'));
                if (pageId === 'projects') pages.projects.classList.add('active-page');
                if (pageId === 'rules') pages.rules.classList.add('active-page');
            });
        });
    }

    // модалка правил для модераторов
    function setupModerToggle() {
        const btn = document.getElementById('moderToggleBtn');
        const panel = document.getElementById('moderRulesPanel');
        if (btn && panel) {
            btn.addEventListener('click', () => {
                if (panel.style.display === 'none') {
                    panel.style.display = 'block';
                    btn.textContent = '❌ скрыть раздел модераторов';
                } else {
                    panel.style.display = 'none';
                    btn.textContent = '🔐 раздел для модераторов и стажеров';
                }
            });
        }
    }

    renderNormalRules();
    renderModerRules();
    loadProjects();
    setupNavigation();
    setupModerToggle();
</script>
</body>
</html>
