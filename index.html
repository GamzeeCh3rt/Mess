<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>KDEterm — мессенджер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="title">kdeterm — <span id="myNameDisplay">пользователь</span></div>
            <button class="new-chat" id="newChatBtn">+ новый диалог</button>
        </div>
        <div class="chat-list" id="chatList"></div>
        <div class="sidebar-footer">
            <button class="settings-btn" id="openSettingsBtn">⚙ настройки</button>
        </div>
    </div>
    <div class="main">
        <div class="chat-header">
            <div class="current-chat-name" id="currentChatName">выберите чат</div>
        </div>
        <div class="messages-area" id="messagesArea">
            <div class="empty-state">~ нет выбранного диалога</div>
        </div>
        <div class="input-area" id="inputArea" style="display: none;">
            <div class="input-row">
                <textarea class="message-input" id="messageInput" rows="1" placeholder="сообщение..."></textarea>
                <button class="send-btn" id="sendBtn">отправить</button>
            </div>
        </div>
    </div>
</div>

<!-- модальное окно нового чата -->
<div class="modal" id="newChatModal">
    <div class="modal-content">
        <div class="modal-title">новый диалог</div>
        <input type="text" id="newChatName" placeholder="имя собеседника" class="modal-input">
        <div class="modal-buttons">
            <button id="cancelNewChat">отмена</button>
            <button id="createNewChat">создать</button>
        </div>
    </div>
</div>

<!-- настройки -->
<div class="modal" id="settingsModal">
    <div class="modal-content">
        <div class="modal-title">настройки</div>
        <label>ваше имя:</label>
        <input type="text" id="userNameInput" placeholder="никнейм" class="modal-input">
        <div class="modal-buttons">
            <button id="closeSettings">закрыть</button>
        </div>
        <div style="margin-top: 16px; border-top: 1px solid #2a2a32; padding-top: 12px;">
            <button id="resetDataBtn" style="background: #f38ba8; color: #111116;">сбросить все данные</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
